[package]
name = "escrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false
description = "Deposit escrow for Turistellar bookings"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
# linker-plugin-lto makes rustc fail to load the bytes_lit proc-macro on Windows GNU.
lto = false
